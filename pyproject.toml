[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rock-discontinuity"
version = "0.1.0"
description = "LAS/LAZ rock discontinuity plane extraction and validation tools"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "shapely>=2.0",
  "laspy>=2.4",
  "lazrs>=0.6",
  "PyYAML>=6.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
osgb = [
  "pyproj>=3.7",
]
dev = [
  "pytest>=8",
]

[project.scripts]
rock-discontinuity = "rock_discontinuity.app.main:main"

[tool.setuptools.packages.find]
include = ["rock_discontinuity*"]

[tool.setuptools.package-data]
rock_discontinuity = ["config/*.yaml"]
